# LingoLive: Nginx reverse proxy in front of the app on 127.0.0.1:3000.
# Replace learn.example.com with your domain. Run `certbot --nginx -d <domain>`
# afterwards: it adds the HTTPS (443) server block and the HTTP -> HTTPS redirect.

# Keep connections to the app open instead of reconnecting for every request.
upstream lingolive_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Only send "Connection: upgrade" for real WebSocket upgrades; otherwise clear it
# so keepalive to the app keeps working.
map $http_upgrade $lingolive_connection {
    default upgrade;
    ""      "";
}

server {
    listen 80;
    listen [::]:80;
    server_name learn.example.com;

    client_max_body_size 110m;

    # Compress text responses (HTML, JS, CSS, JSON, SVG). Video/audio/images are
    # already compressed and are not listed on purpose.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    # Hashed build files never change under the same name: cache for a year.
    location /_next/static/ {
        proxy_pass http://lingolive_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The service worker must always be re-checked so updates reach users.
    location = /sw.js {
        proxy_pass http://lingolive_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
    }

    # Lesson video/audio: stream straight through. Buffering would make seeking
    # and the first frame slower. Authorization still happens in the app.
    location ~ ^/api/.+/(media|audio|video)$ {
        proxy_pass http://lingolive_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://lingolive_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $lingolive_connection;
        proxy_request_buffering off;
    }

    # There is deliberately no /media alias. Every media request must pass
    # through the application authorization routes.
}
